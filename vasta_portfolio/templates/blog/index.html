{% extends 'base.html' %}
{% load static %}
{% block extra_css %}<link href="{% static 'assets/css/blog.css' %}?v=20260921-blog1" rel="stylesheet">{% endblock %}

{% block projects %}
    <!-- ======= Blog Section ======= -->
    <section class="section site-portfolio blog-index">
      <div class="container">
        <div class="row mb-5 align-items-center">
          <div class="col-md-12 col-lg-6 mb-4 mb-lg-0" data-aos="fade-up">
            <h2>blog</h2>
          </div>
        </div>
        <div class="blog-grid">
          {% for article in articles %}
            <article class="blog-card">
              <a href="{{ article.get_absolute_url }}" class="blog-card-link">
                {% if article.cover_image %}
                  <img src="{{ article.cover_image.url }}" alt="" loading="lazy">
                {% else %}
                  <img src="{% static 'assets/img/img_1.jpg' %}" alt="" loading="lazy">
                {% endif %}
                <h3>{{ article.title }}</h3>
              </a>
            </article>
          {% empty %}
            <p>No articles yet.</p>
          {% endfor %}
        </div>
      </div>
    </section><!-- End Blog Section -->

{% endblock %}
